<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#08120d">
  <title>Verdant Ascension</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-app">
    <canvas id="gameCanvas" aria-label="Verdant Ascension battlefield"></canvas>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">V</span>
        <div>
          <strong>Verdant Ascension</strong>
          <span>Living battlefield</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="territory-pill" id="territoryInfo">3 / 13</div>
        <button id="resetButton" class="icon-button" aria-label="Reset battlefield">↻</button>
      </div>
    </header>

    <div id="status" class="status-toast">Tap one of your green patches.</div>

    <section id="selectionDock" class="selection-dock">
      <div class="selection-copy">
        <span class="selection-label">Selected growth</span>
        <strong id="selectedInfo">Small Grass</strong>
        <span id="growthInfo" class="growth-info">32 / 42 growth</span>
      </div>
      <button id="upgradeButton" class="upgrade-button">Evolve</button>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
